name: Deploy Quarto Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # TinyTeX (for the PDF CV) is cached so most builds skip the LaTeX
      # download. The key rotates monthly to pick up TeX Live updates.
      - name: Cache key month
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache TinyTeX
        id: tinytex-cache
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-${{ steps.month.outputs.month }}

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: ${{ steps.tinytex-cache.outputs.cache-hit != 'true' }}

      - name: Add cached TinyTeX to PATH
        if: steps.tinytex-cache.outputs.cache-hit == 'true'
        run: echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Generate content from data
        run: |
          python3 scripts/generate_shared.py
          python3 scripts/generate_publications.py
          python3 scripts/generate_cv.py

      - name: Render Quarto Site
        run: quarto render

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
